<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="公式メタデータを根拠に、次に遊ぶゲームを検索・比較できるゲームライブラリ。" />
    <link rel="canonical" href="https://kafka2306.github.io/game-library-dashboard/" />
    <title>Game Library Navigator</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #F7F5EF;
        --surface: #FFFFFF;
        --foreground: #17233F;
        --muted: #667085;
        --border: #D9D6CE;
        --primary: #2563EB;
        --accent: #7DD3FC;
        --success: #15803D;
        --focus: #2563EB;
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --radius: 2px;
        --control-height: 32px;
        --touch-target: 44px;
        --sans: Inter, "Noto Sans JP", system-ui, sans-serif;
        --mono: "Roboto Mono", "SFMono-Regular", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--canvas); color: var(--foreground); font: 14px/1.55 var(--sans); }
      a { color: var(--primary); }
      button, input, select { font: inherit; }
      button, input, select, a.action { min-height: var(--touch-target); }
      :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
      .shell { width: min(1180px, calc(100% - 24px)); margin: 0 auto; padding: 0 0 48px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 56px; border-bottom: 1px solid var(--border); }
      .brand { font-weight: 800; }
      .top-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--space-2); }
      .top-actions a { text-decoration: none; }
      .lang-switch { display: inline-flex; border: 1px solid var(--border); background: var(--surface); }
      .lang-switch button { min-width: 44px; border: 0; background: transparent; color: var(--muted); cursor: pointer; }
      .lang-switch button[aria-pressed="true"] { background: var(--foreground); color: var(--surface); }
      .hero { padding: 36px 0 20px; max-width: 800px; }
      h1 { margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.05; letter-spacing: -0.03em; }
      .lead { margin: 14px 0 0; color: var(--muted); font-size: 1rem; max-width: 720px; }
      .metrics { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); }
      .metric { border-left: 2px solid var(--border); padding: 2px 10px; color: var(--muted); }
      .metric strong { color: var(--foreground); font-family: var(--mono); margin-right: 6px; }
      .controls { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: minmax(220px, 1.4fr) repeat(4, minmax(130px, 1fr)) auto; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(10px); }
      .control { display: grid; gap: var(--space-1); }
      label { color: var(--muted); font-size: 12px; font-weight: 700; }
      input, select, button { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--foreground); padding: 0 10px; }
      button { cursor: pointer; font-weight: 700; }
      .summary { display: flex; align-items: end; justify-content: space-between; gap: var(--space-3); margin: 24px 0 10px; }
      .summary h2 { margin: 0; font-size: 20px; }
      .count { color: var(--muted); font: 12px var(--mono); }
      .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: var(--space-3); }
      .game-card { display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--border); background: var(--surface); min-width: 0; }
      .game-card[hidden] { display: none; }
      .game-card img { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; background: var(--canvas); }
      .game-body { display: grid; gap: var(--space-3); padding: var(--space-3); }
      .game-title { margin: 0; font-size: 16px; line-height: 1.3; }
      .meta { display: grid; gap: var(--space-1); color: var(--muted); font-size: 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: var(--space-1); }
      .chip { border: 1px solid var(--border); padding: 3px 6px; font-size: 12px; background: var(--canvas); }
      .card-links { display: flex; flex-wrap: wrap; gap: var(--space-2); align-self: end; }
      .card-links a { display: inline-flex; align-items: center; min-height: 32px; font-size: 12px; font-weight: 700; }
      .compare-toggle[aria-pressed="true"] { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--surface)); color: var(--primary); }
      .compare-panel { display: grid; gap: var(--space-3); margin: 10px 0 18px; padding: var(--space-3); border: 1px solid var(--primary); background: var(--surface); }
      .compare-panel[hidden] { display: none; }
      .compare-head { display: flex; align-items: start; justify-content: space-between; gap: var(--space-3); }
      .compare-head h2 { margin: 0; font-size: 18px; }
      .compare-hint { color: var(--muted); font-size: 12px; }
      .compare-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
      .compare-game { border: 1px solid var(--border); padding: var(--space-3); min-width: 0; }
      .compare-game h3 { margin: 0 0 var(--space-2); font-size: 16px; }
      .compare-row { display: grid; grid-template-columns: 7rem 1fr; gap: var(--space-2); padding: 5px 0; border-top: 1px solid var(--border); font-size: 12px; }
      .compare-row:first-of-type { border-top: 0; }
      .compare-label { color: var(--muted); font-weight: 700; }
      .empty { display: none; border: 1px solid var(--border); background: var(--surface); color: var(--muted); padding: var(--space-4); }
      .empty.visible { display: block; }
      .analysis { margin-top: 28px; border-top: 1px solid var(--border); padding-top: var(--space-4); }
      details { background: var(--surface); border: 1px solid var(--border); }
      summary { cursor: pointer; padding: var(--space-3); font-weight: 800; }
      .analysis-body { display: grid; gap: var(--space-3); padding: 0 var(--space-3) var(--space-3); }
      .ontology { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-2); }
      .node { border: 1px solid var(--border); padding: var(--space-3); }
      .node b { display: block; margin-bottom: var(--space-1); }
      .node span { color: var(--muted); font-size: 12px; }
      .family-chart { display: grid; gap: var(--space-2); }
      .bar { display: grid; grid-template-columns: minmax(9rem, 13rem) 1fr 3rem; gap: var(--space-2); align-items: center; font-size: 12px; }
      .rail { height: 8px; background: var(--border); }
      .fill { display: block; height: 100%; width: var(--value); background: var(--primary); }
      .evidence { color: var(--muted); font-size: 12px; }
      .evidence code { color: var(--foreground); font-family: var(--mono); }
      @media (max-width: 960px) {
        .controls { grid-template-columns: 1fr 1fr; position: static; }
        .control:first-child { grid-column: 1 / -1; }
        .ontology { grid-template-columns: 1fr 1fr; }
      }
      @media (max-width: 640px) {
        .topbar, .summary { align-items: flex-start; flex-direction: column; }
        .top-actions { justify-content: flex-start; }
        .hero { padding-top: 24px; }
        .controls { grid-template-columns: 1fr; }
        .control:first-child { grid-column: auto; }
        .ontology, .compare-grid { grid-template-columns: 1fr; }
        .compare-row { grid-template-columns: 1fr; gap: 2px; }
        .bar { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <nav class="topbar" aria-label="Library links">
        <div class="brand">Game Library</div>
        <div class="top-actions">
          <div class="lang-switch" aria-label="Language">
            <button type="button" data-lang-button="ja" aria-pressed="true">JA</button>
            <button type="button" data-lang-button="en" aria-pressed="false">EN</button>
          </div>
          <a href="identity.html">Identity</a>
          <a href="https://github.com/KAFKA2306/game-library-dashboard" rel="noreferrer">GitHub</a>
        </div>
      </nav>

      <section class="hero">
        <h1 id="hero-title"></h1>
        <p class="lead" id="hero-lead"></p>
        <div class="metrics" aria-label="Library metrics"></div>
      </section>

      <section class="controls" aria-label="Game filters">
        <div class="control"><label for="search" id="label-search"></label><input id="search" type="search" autocomplete="off" /></div>
        <div class="control"><label for="family" id="label-family"></label><select id="family"><option value="">All</option></select></div>
        <div class="control"><label for="genre" id="label-genre"></label><select id="genre"><option value="">All</option></select></div>
        <div class="control"><label for="mode" id="label-mode"></label><select id="mode"><option value="">All</option></select></div>
        <div class="control"><label for="tag" id="label-tag"></label><select id="tag"><option value="">All</option></select></div>
        <button id="reset" type="button">Reset</button>
      </section>

      <section class="summary">
        <div><h2 id="library-title"></h2><span class="count" id="result-count">loading</span></div>
        <span class="count" id="price-count"></span>
      </section>
      <section class="compare-panel" id="compare-panel" aria-live="polite" hidden>
        <div class="compare-head">
          <div>
            <h2 id="compare-title"></h2>
            <div class="compare-hint" id="compare-hint"></div>
          </div>
          <button id="compare-clear" type="button"></button>
        </div>
        <div class="compare-grid" id="compare-grid"></div>
      </section>
      <section class="game-grid" id="game-grid" aria-label="Game library"></section>
      <div class="empty" id="empty"></div>

      <section class="analysis">
        <details>
          <summary id="analysis-title"></summary>
          <div class="analysis-body">
            <section class="ontology" aria-label="Ontology"></section>
            <section class="family-chart" aria-label="Family distribution"></section>
            <section class="evidence" id="evidence"></section>
          </div>
        </details>
      </section>
    </main>

    <script>
      const controls = {
        search: document.querySelector('#search'),
        family: document.querySelector('#family'),
        genre: document.querySelector('#genre'),
        mode: document.querySelector('#mode'),
        tag: document.querySelector('#tag'),
        reset: document.querySelector('#reset'),
        count: document.querySelector('#result-count'),
        price: document.querySelector('#price-count'),
        empty: document.querySelector('#empty'),
      };
      const grid = document.querySelector('#game-grid');
      const comparePanel = document.querySelector('#compare-panel');
      const compareGrid = document.querySelector('#compare-grid');
      const compareClear = document.querySelector('#compare-clear');
      let libraryCache = null;
      let compareIds = [];
      let currentLang = getInitialLanguage();
      const text = {
        ja: {
          title: '次に遊ぶゲームを、すぐ絞り込む。',
          lead: '所蔵ゲームを検索し、ジャンル・プレイ形態・設計ファミリーで比較できます。公式情報と派生分類を分けて保持し、根拠がない情報は推測で埋めません。',
          search: 'タイトル・開発元・タグ', searchPlaceholder: '例: co-op, strategy, VR',
          family: '設計ファミリー', genre: '公式ジャンル', mode: 'プレイ形態', tag: '派生タグ',
          library: '候補ゲーム', empty: '条件に一致するゲームがありません。条件を減らして再検索してください。',
          shown: (count) => `${count}件を表示`, free: (free, paid) => `無料 ${free} / 有料または不明 ${paid}`,
          metrics: ['収録', '設計ファミリー', '発売済み', '公式サイトあり'],
          analysis: '分類・出典を確認する',
          compare: { add: '比較に追加', remove: '比較から外す', title: '2本を比較', one: 'あと1本選ぶと違いを並べて確認できます。', two: '同じ正準データの項目を横並びで比較しています。', clear: '比較をクリア', limit: '比較は2本までです。' },
          compareLabels: { release: '発売', family: '設計ファミリー', modes: 'プレイ形態', genres: '公式ジャンル', tags: '派生タグ', links: '公式リンク' },
          evidence: (schema, date, policy) => `Schema <code>${schema}</code> / Generated <code>${date}</code> / Source policy: ${policy}`,
          image: '画像上の日付', designer: 'Designer', developerUnknown: 'Developer unknown',
          links: { store: 'Store', official: 'Official', board: 'Board', metadata: 'Evidence' },
        },
        en: {
          title: 'Find the next game to play.',
          lead: 'Search your library and compare games by genre, play mode, and design family. Official metadata and derived classification stay separate, and unknowns are not guessed.',
          search: 'Title, developer, or tag', searchPlaceholder: 'e.g. co-op, strategy, VR',
          family: 'Design family', genre: 'Official genre', mode: 'Play mode', tag: 'Derived tag',
          library: 'Game candidates', empty: 'No games match these filters. Remove a condition and try again.',
          shown: (count) => `${count} shown`, free: (free, paid) => `${free} free / ${paid} paid or unknown`,
          metrics: ['Titles', 'Design families', 'Released', 'Official sites'],
          analysis: 'Inspect classification and evidence',
          compare: { add: 'Add to compare', remove: 'Remove', title: 'Compare two games', one: 'Choose one more game to compare them side by side.', two: 'Comparing the same canonical fields side by side.', clear: 'Clear comparison', limit: 'You can compare up to two games.' },
          compareLabels: { release: 'Release', family: 'Design family', modes: 'Play modes', genres: 'Official genres', tags: 'Derived tags', links: 'Official links' },
          evidence: (schema, date, policy) => `Schema <code>${schema}</code> / Generated <code>${date}</code> / Source policy: ${policy}`,
          image: 'Image date', designer: 'Designer', developerUnknown: 'Developer unknown',
          links: { store: 'Store', official: 'Official', board: 'Board', metadata: 'Evidence' },
        },
      };

      function getInitialLanguage() {
        const saved = localStorage.getItem('game-dashboard-lang');
        if (saved === 'ja' || saved === 'en') return saved;
        return navigator.language?.startsWith('ja') ? 'ja' : 'en';
      }
      function option(select, value) {
        const node = document.createElement('option');
        node.value = value;
        node.textContent = value;
        select.append(node);
      }
      function unique(values) { return [...new Set(values)].filter(Boolean).sort((a, b) => a.localeCompare(b)); }
      function link(label, href) { return href ? `<a href="${href}" rel="noreferrer">${label}</a>` : ''; }
      function chip(value) { return `<span class="chip">${value}</span>`; }
      function hasValue(source, value) { return !value || source.split('|').includes(value); }
      function syncUrl() {
        const params = new URLSearchParams();
        if (controls.search.value.trim()) params.set('q', controls.search.value.trim());
        for (const key of ['family', 'genre', 'mode', 'tag']) if (controls[key].value) params.set(key, controls[key].value);
        if (compareIds.length) params.set('compare', compareIds.join(','));
        const next = `${location.pathname}${params.size ? `?${params}` : ''}${location.hash}`;
        history.replaceState(null, '', next);
      }
      function restoreUrl() {
        const params = new URLSearchParams(location.search);
        controls.search.value = params.get('q') || '';
        for (const key of ['family', 'genre', 'mode', 'tag']) {
          const value = params.get(key) || '';
          if ([...controls[key].options].some((item) => item.value === value)) controls[key].value = value;
        }
      }
      function restoreCompareUrl(games) {
        const requested = (new URLSearchParams(location.search).get('compare') || '').split(',').filter(Boolean);
        const validIds = new Set(games.map((game) => game.id));
        compareIds = [...new Set(requested)].filter((id) => validIds.has(id)).slice(0, 2);
      }
      function compareValue(values) {
        return values?.length ? values.join(', ') : '—';
      }
      function renderCompare({ updateUrl = true } = {}) {
        if (!libraryCache) return;
        const t = text[currentLang];
        const selected = compareIds.map((id) => libraryCache.games.find((game) => game.id === id)).filter(Boolean);
        comparePanel.hidden = selected.length === 0;
        document.querySelector('#compare-title').textContent = t.compare.title;
        document.querySelector('#compare-hint').textContent = selected.length === 1 ? t.compare.one : t.compare.two;
        compareClear.textContent = t.compare.clear;
        compareGrid.innerHTML = selected.map((game) => `
          <article class="compare-game">
            <h3>${game.title}</h3>
            <div class="compare-row"><span class="compare-label">${t.compareLabels.release}</span><span>${game.release_date}</span></div>
            <div class="compare-row"><span class="compare-label">${t.compareLabels.family}</span><span>${game.design_family}</span></div>
            <div class="compare-row"><span class="compare-label">${t.compareLabels.modes}</span><span>${compareValue(game.play_modes)}</span></div>
            <div class="compare-row"><span class="compare-label">${t.compareLabels.genres}</span><span>${compareValue(game.official_genres)}</span></div>
            <div class="compare-row"><span class="compare-label">${t.compareLabels.tags}</span><span>${compareValue(game.derived_tags)}</span></div>
            <div class="compare-row"><span class="compare-label">${t.compareLabels.links}</span><span class="card-links">${link(t.links.store, game.official_store)}${link(t.links.official, game.official_website)}${link(t.links.metadata, game.evidence.metadata_source)}</span></div>
          </article>`).join('');
        document.querySelectorAll('[data-compare-id]').forEach((button) => {
          const selectedNow = compareIds.includes(button.dataset.compareId);
          button.setAttribute('aria-pressed', String(selectedNow));
          button.textContent = selectedNow ? t.compare.remove : t.compare.add;
          button.disabled = !selectedNow && compareIds.length >= 2;
          button.title = button.disabled ? t.compare.limit : '';
        });
        if (updateUrl) syncUrl();
      }
      function toggleCompare(id) {
        if (compareIds.includes(id)) {
          compareIds = compareIds.filter((item) => item !== id);
        } else if (compareIds.length < 2) {
          compareIds = [...compareIds, id];
        }
        renderCompare();
      }
      function applyFilters({ updateUrl = true } = {}) {
        const query = controls.search.value.trim().toLowerCase();
        let shown = 0;
        for (const card of document.querySelectorAll('.game-card')) {
          const visible =
            (!query || card.dataset.search.includes(query)) &&
            (!controls.family.value || card.dataset.family === controls.family.value) &&
            hasValue(card.dataset.genres, controls.genre.value) &&
            hasValue(card.dataset.modes, controls.mode.value) &&
            hasValue(card.dataset.tags, controls.tag.value);
          card.hidden = !visible;
          if (visible) shown += 1;
        }
        controls.count.textContent = text[currentLang].shown(shown);
        controls.empty.classList.toggle('visible', shown === 0);
        if (updateUrl) syncUrl();
      }
      function applyLanguage() {
        const t = text[currentLang];
        document.documentElement.lang = currentLang;
        localStorage.setItem('game-dashboard-lang', currentLang);
        document.querySelectorAll('[data-lang-button]').forEach((button) => button.setAttribute('aria-pressed', String(button.dataset.langButton === currentLang)));
        document.querySelector('#hero-title').textContent = t.title;
        document.querySelector('#hero-lead').textContent = t.lead;
        document.querySelector('#label-search').textContent = t.search;
        document.querySelector('#label-family').textContent = t.family;
        document.querySelector('#label-genre').textContent = t.genre;
        document.querySelector('#label-mode').textContent = t.mode;
        document.querySelector('#label-tag').textContent = t.tag;
        document.querySelector('#library-title').textContent = t.library;
        document.querySelector('#analysis-title').textContent = t.analysis;
        controls.search.placeholder = t.searchPlaceholder;
        controls.empty.textContent = t.empty;
        if (libraryCache) render(libraryCache, true);
      }
      function render(library, preserveFilters = false) {
        libraryCache = library;
        const t = text[currentLang];
        const games = library.games;
        const families = Object.entries(library.ontology.design_families);
        const genres = unique(games.flatMap((game) => game.official_genres));
        const modes = unique(games.flatMap((game) => game.play_modes));
        const tags = unique(games.flatMap((game) => game.derived_tags));
        const released = games.filter((game) => !game.coming_soon).length;
        const freeCount = games.filter((game) => game.is_free).length;
        const officialSites = games.filter((game) => game.official_website).length;
        const current = preserveFilters ? Object.fromEntries(['search', 'family', 'genre', 'mode', 'tag'].map((key) => [key, controls[key].value])) : null;

        document.querySelector('.metrics').innerHTML = [[games.length, t.metrics[0]], [families.length, t.metrics[1]], [released, t.metrics[2]], [officialSites, t.metrics[3]]]
          .map(([value, label]) => `<span class="metric"><strong>${value}</strong>${label}</span>`).join('');
        for (const select of [controls.family, controls.genre, controls.mode, controls.tag]) select.length = 1;
        families.forEach(([key]) => option(controls.family, key));
        genres.forEach((value) => option(controls.genre, value));
        modes.forEach((value) => option(controls.mode, value));
        tags.forEach((value) => option(controls.tag, value));
        if (current) {
          for (const key of ['search', 'family', 'genre', 'mode', 'tag']) controls[key].value = current[key];
        } else {
          restoreUrl();
        }

        controls.price.textContent = t.free(freeCount, games.length - freeCount);
        grid.innerHTML = games.map((game) => `
          <article class="game-card" data-search="${`${game.title} ${game.developers.join(' ')} ${game.publishers.join(' ')} ${game.derived_tags.join(' ')}`.toLowerCase()}" data-family="${game.design_family}" data-genres="${game.official_genres.join('|')}" data-modes="${game.play_modes.join('|')}" data-tags="${game.derived_tags.join('|')}">
            <img src="${game.image}" alt="${game.title} official image" loading="lazy" />
            <div class="game-body">
              <h3 class="game-title">${game.title}</h3>
              <div class="meta">
                <span>${game.release_date} / ${t.image}: ${game.visible_date_from_image}</span>
                <span>${game.developers.join(', ') || t.developerUnknown}</span>
                ${game.original_designer ? `<span>${t.designer}: ${game.original_designer.join(', ')}</span>` : ''}
                <span>${game.design_family}</span>
              </div>
              <div class="chips">${[...game.play_modes, ...game.official_genres.slice(0, 3), ...game.derived_tags.slice(0, 4)].map(chip).join('')}</div>
              <div class="card-links"><button class="compare-toggle" type="button" data-compare-id="${game.id}" aria-pressed="false">${t.compare.add}</button>${link(t.links.store, game.official_store)}${link(t.links.official, game.official_website)}${link(t.links.board, game.board_game_official)}${link(t.links.metadata, game.evidence.metadata_source)}</div>
            </div>
          </article>`).join('');
        document.querySelector('.ontology').innerHTML = families.map(([key, description]) => `<div class="node"><b>${key}</b><span>${description}</span></div>`).join('');
        document.querySelector('.family-chart').innerHTML = families.map(([key]) => {
          const count = games.filter((game) => game.design_family === key).length;
          const width = `${Math.max(4, Math.round((count / games.length) * 100))}%`;
          return `<div class="bar"><span>${key}</span><span class="rail"><span class="fill" style="--value:${width}"></span></span><span>${count}</span></div>`;
        }).join('');
        document.querySelector('#evidence').innerHTML = t.evidence(library.schema, library.generated_at, library.ontology.source_policy);
        if (!preserveFilters) restoreCompareUrl(games);
        applyFilters({ updateUrl: false });
        renderCompare({ updateUrl: false });
      }

      for (const element of [controls.search, controls.family, controls.genre, controls.mode, controls.tag]) element.addEventListener('input', () => applyFilters());
      grid.addEventListener('click', (event) => { const button = event.target.closest('[data-compare-id]'); if (button) toggleCompare(button.dataset.compareId); });
      compareClear.addEventListener('click', () => { compareIds = []; renderCompare(); });
      document.querySelectorAll('[data-lang-button]').forEach((button) => button.addEventListener('click', () => { currentLang = button.dataset.langButton; applyLanguage(); }));
      controls.reset.addEventListener('click', () => {
        controls.search.value = '';
        controls.family.value = '';
        controls.genre.value = '';
        controls.mode.value = '';
        controls.tag.value = '';
        applyFilters();
        controls.search.focus();
      });
      applyLanguage();
      fetch('data/game-library.json')
        .then((response) => { if (!response.ok) throw new Error(`game library fetch failed: ${response.status}`); return response.json(); })
        .then((library) => render(library))
        .catch((error) => { controls.empty.textContent = `UNVERIFIED: ${error.message}`; controls.empty.classList.add('visible'); throw error; });
    </script>
  </body>
</html>
