<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Game Library Identity View</title>
  <style>
    :root{font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;color:#171713;background:#f4f1ea}*{box-sizing:border-box}body{margin:0}.shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:24px 0 48px}a{color:inherit}.head{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid #d9d1c3;padding-bottom:16px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.metric,.card,.notice{background:#fffdf7;border:1px solid #d9d1c3;border-radius:10px;padding:14px}.metric strong{display:block;font-size:2rem}.metric span,.muted{color:#65665c}.controls{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:10px;margin-bottom:16px}.controls input,.controls select{width:100%;min-height:42px;border:1px solid #d9d1c3;border-radius:8px;background:#fff;padding:0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card h2{font-size:1.05rem;margin:0 0 8px}.row{font-size:.83rem;line-height:1.55}.badge{display:inline-block;border:1px solid #d9d1c3;border-radius:999px;padding:3px 7px;margin:3px 3px 0 0;font-size:.75rem}.conflict{border-color:#9a3f3f;background:#fff4f4}.notice{margin:16px 0}.notice code{font-family:ui-monospace,monospace}@media(max-width:760px){.metrics,.controls{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="shell">
  <header class="head"><div><h1>Library Identity View</h1><p class="muted">Work / Edition / PlatformRelease / Holding を分離した監査ビュー</p></div><nav><a href="./">通常ビュー</a> · <a href="https://github.com/KAFKA2306/game-library-dashboard/issues/2">Issue #2</a></nav></header>
  <section class="metrics" id="metrics"></section>
  <section class="notice">タイトル文字列は統合キーではありません。Steam AppID は <code>PlatformRelease.external_ids.steam_appid</code> のみに置き、明示的な <code>identity-links.json</code> がないレコード間は自動統合しません。</section>
  <section class="controls">
    <input id="q" type="search" placeholder="作品名を検索" />
    <select id="edition"><option value="">全Edition</option></select>
    <select id="store"><option value="">全Store</option></select>
    <select id="ownership"><option value="">全Ownership</option></select>
  </section>
  <section class="grid" id="grid"></section>
</main>
<script>
const stable=(prefix,seed)=>prefix+'_'+hash(seed).slice(0,16);
function hash(s){/* deterministic non-cryptographic UI key; canonical validation is Python SHA-256 */let h1=0xdeadbeef^s.length,h2=0x41c6ce57^s.length;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16).padStart(14,'0')}
function build(legacy,links){const overrides=new Map((links.records||[]).map(x=>[x.legacy_id,x]));const works=new Map(),editions=new Map(),releases=new Map(),holdings=[];for(const g of legacy.games){const o=overrides.get(g.id)||{};const wid=o.work_id||stable('work','legacy-record:'+g.id);const eid=o.edition_id||stable('edition',wid+'|'+g.id+'|edition');const rid=o.platform_release_id||stable('release',eid+'|'+g.id+'|steam');const confidence=o.identity_confidence||(g.visible_identification_confidence==='High'?'VERIFIED':'CANDIDATE');const ownership=o.ownership_status||'OWNED';if(confidence==='CONFLICT'&&(ownership==='OWNED'||ownership==='MANAGED'))continue;works.set(wid,works.get(wid)||{id:wid,title:o.canonical_title||g.title});editions.set(eid,editions.get(eid)||{id:eid,work_id:wid,name:o.edition_name||'Standard Edition',status:o.edition_status||'STANDARD'});releases.set(rid,releases.get(rid)||{id:rid,edition_id:eid,platform:o.platform||'PC',store:o.store||'Steam',region:o.region||'GLOBAL',appid:g.appid,store_url:g.official_store});holdings.push({id:o.holding_id||stable('holding',rid+'|primary-library'),release_id:rid,ownership,confidence,metadata:g})}return{works,editions,releases,holdings,counts:{works:works.size,editions:editions.size,platform_releases:releases.size,holdings:holdings.length}}}
function option(select,value){if(![...select.options].some(x=>x.value===value)){const o=document.createElement('option');o.value=o.textContent=value;select.append(o)}}
function render(model){const $=s=>document.querySelector(s);$('#metrics').innerHTML=Object.entries(model.counts).map(([k,v])=>`<div class="metric"><strong>${v}</strong><span>${k.replace('_',' ')}</span></div>`).join('');for(const e of model.editions.values())option($('#edition'),e.status);for(const r of model.releases.values())option($('#store'),r.store);for(const h of model.holdings)option($('#ownership'),h.ownership);const draw=()=>{const q=$('#q').value.trim().toLowerCase(),es=$('#edition').value,ss=$('#store').value,os=$('#ownership').value;$('#grid').innerHTML=model.holdings.map(h=>{const r=model.releases.get(h.release_id),e=model.editions.get(r.edition_id),w=model.works.get(e.work_id);if(q&&!w.title.toLowerCase().includes(q)||es&&e.status!==es||ss&&r.store!==ss||os&&h.ownership!==os)return'';return `<article class="card ${h.confidence==='CONFLICT'?'conflict':''}"><h2>${w.title}</h2><div class="row"><b>Work</b> ${w.id}</div><div class="row"><b>Edition</b> ${e.name} · ${e.status}</div><div class="row"><b>Release</b> ${r.platform} / ${r.store} / ${r.region}</div><div class="row"><b>Holding</b> ${h.ownership} · ${h.confidence}</div><div><span class="badge">Steam AppID ${r.appid??'—'}</span><span class="badge">${h.metadata.design_family||'unclassified'}</span></div>${r.store_url?`<p><a href="${r.store_url}" rel="noreferrer">official store</a></p>`:''}</article>`}).join('')};for(const el of [$('#q'),$('#edition'),$('#store'),$('#ownership')])el.addEventListener('input',draw);draw()}
Promise.all([fetch('data/game-library.json').then(r=>r.json()),fetch('data/identity-links.json').then(r=>r.json())]).then(([legacy,links])=>render(build(legacy,links))).catch(err=>{document.querySelector('#grid').textContent='Failed to load identity data: '+err.message});
</script></body></html>
