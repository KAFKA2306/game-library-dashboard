name: Data quality

on:
  pull_request:
    paths:
      - "data/game-library.json"
      - "scripts/validate_game_library.py"
      - "tests/test_validate_game_library.py"
      - ".github/workflows/data-quality.yml"
  push:
    branches: [main]
    paths:
      - "data/game-library.json"
      - "scripts/validate_game_library.py"
      - "tests/test_validate_game_library.py"
      - ".github/workflows/data-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator and tests
        run: python -m py_compile scripts/validate_game_library.py tests/test_validate_game_library.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate published dataset
        run: python scripts/validate_game_library.py data/game-library.json --report build/game-library-audit.json
      - name: Upload reproducibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-library-audit
          path: build/game-library-audit.json
          if-no-files-found: error
          retention-days: 14
