name: Library sync audit

on:
  push:
    paths:
      - "data/game-library.json"
      - "data/library-sync-queue.json"
      - "data/recommendation-candidates.json"
      - "data/steam-inventory-request-contract.json"
      - "scripts/audit_library_sync.py"
      - "scripts/reconcile_steam_inventory.py"
      - "tests/test_reconcile_steam_inventory.py"
      - "tests/test_steam_inventory_request_contract.py"
      - ".github/workflows/library-sync-audit.yml"
  pull_request:
    paths:
      - "data/game-library.json"
      - "data/library-sync-queue.json"
      - "data/recommendation-candidates.json"
      - "data/steam-inventory-request-contract.json"
      - "scripts/audit_library_sync.py"
      - "scripts/reconcile_steam_inventory.py"
      - "tests/test_reconcile_steam_inventory.py"
      - "tests/test_steam_inventory_request_contract.py"
      - ".github/workflows/library-sync-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile reconciliation code
        run: python -m py_compile scripts/audit_library_sync.py scripts/reconcile_steam_inventory.py tests/test_reconcile_steam_inventory.py tests/test_steam_inventory_request_contract.py
      - name: Test machine-readable reconciliation
        run: python -m unittest tests.test_reconcile_steam_inventory tests.test_steam_inventory_request_contract -v
      - name: Validate library reconciliation state
        run: python scripts/audit_library_sync.py
      - name: Remove generated Python caches
        if: always()
        run: find . -type d -name __pycache__ -prune -exec rm -rf {} +
      - name: Verify checkout is clean
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=all)"
