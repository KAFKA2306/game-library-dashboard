name: Apply verified library sync

on:
  push:
    branches:
      - data/apply-library-sync-2026-08-09
    paths:
      - "data/library-sync-queue.json"
      - "scripts/apply_library_sync.py"
      - "scripts/audit_library_sync.py"
      - ".github/workflows/apply-library-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/apply-library-sync-2026-08-09
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Promote APPEND_READY records
        run: python scripts/apply_library_sync.py
      - name: Audit resulting state
        run: python scripts/audit_library_sync.py
      - name: Commit canonical data update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-library.json data/library-sync-queue.json
          if git diff --cached --quiet; then
            echo "No canonical data changes to commit."
            exit 0
          fi
          git commit -m "Merge verified Steam library candidates"
          git push origin HEAD:data/apply-library-sync-2026-08-09
